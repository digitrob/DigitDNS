name: Android

# The Android app is a separate product with its own build, its own toolchain and its
# own release cadence, so it gets its own workflow rather than sharing the Go one —
# a server patch must not rebuild (or fail to build) the app, and an app release must
# not be gated on the Go race suite.
#
# Path filters keep it that way in both directions: this workflow runs only when
# something under android/ (or this file) changes, and the Go workflows in ci.yml and
# release.yml are untouched by an android/ change.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-v*'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant; a tag push
# is matched by its own ref so it never cancels a branch run.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Temurin 17 is the JDK the build targets (sourceCompatibility 17) and the one
      # the Android Gradle Plugin 8.7 line expects. A newer JDK breaks AGP's own
      # bytecode expectations, so it is pinned rather than left to the runner default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      # android-36 is the compileSdk; the NDK is not needed (no native code).
      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: detekt
        working-directory: android
        run: ./gradlew detekt --no-daemon

      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: digitdns-debug-apk
          # ABI splits are on, so the build produces app-<abi>-debug.apk (plus a
          # universal slice), not a single app-debug.apk.
          path: android/app/build/outputs/apk/debug/app-*-debug.apk
          if-no-files-found: error

  release:
    name: Build, sign and attach the release APK
    # Only a tag builds a release; a branch or PR push stops at the build job above.
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # The keystore arrives as base64 in a secret and is materialised only for the
      # duration of the job. A release signed with a missing or wrong key is worse than
      # no release: Android refuses an update whose signature differs, so the operator
      # could never install a later build. The job refuses to proceed without it.
      - name: Materialise the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish an unsigned APK"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/digitdns-release.jks"

      - name: Assemble the signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/digitdns-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # ABI splits emit `app-<abi>-release.apk` (plus `app-universal-release.apk`).
      # Each is renamed to a self-describing `digitdns-<abi>.apk` and
      # paired with a `.sha256`, so an operator can tell at a glance which slice to
      # install on which phone without unpacking anything.
      #
      # A release build without a signing config produces *-unsigned.apk files; the
      # rename would hide that, so the glob below only matches the signed names and
      # the count check fails the job if nothing signed came out.
      - name: Name the artefacts with version and architecture
        id: artefact
        run: |
          set -euo pipefail
          cd android/app/build/outputs/apk/release
          shopt -s nullglob
          # The tag is `android-v0.1.0`; both the `android-` series marker and the `v`
          # are tag syntax, so strip them for a clean `0.1.0` in the filename.
          version="${GITHUB_REF_NAME#android-}"
          version="${version#v}"
          produced=()
          for apk in app-*-release.apk; do
            abi="${apk#app-}"          # <abi>-release.apk
            abi="${abi%-release.apk}"  # <abi>
            out="digitdns-${abi}.apk"
            cp "$apk" "$out"
            sha256sum "$out" > "${out}.sha256"
            produced+=("$out" "${out}.sha256")
          done
          if [ "${#produced[@]}" -eq 0 ]; then
            echo "::error::no signed release APKs found — did assembleRelease produce *-unsigned.apk?"
            exit 1
          fi
          ls -l digitdns-*.apk

      # The APKs live on the server's release, not on one of their own: one release
      # carries the binaries, the offline bundle and the companion APKs together, so
      # an operator downloads everything for a version from one page. The server tag
      # is the android tag with the series marker stripped (`android-v3.3.0` ->
      # `v3.3.0`).
      #
      # The two tags are usually pushed together, and the server release is created
      # only after its full quality gate (vet, tests, race suite) — which can take
      # ten minutes or more. This job waits for it rather than racing it: polling
      # `gh release view` until the release exists, then uploading onto it. A tag
      # pushed without its matching server tag is a mistake, so the wait is capped —
      # capped hard, with a clear error, rather than silently succeeding into the
      # void. `--clobber` keeps re-pushing the same android tag idempotent: the
      # same-named APK files are replaced, never duplicated.
      - name: Wait for the server release, then attach the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME#android-}" # "v3.3.0"
          RELEASE_TAG="v${RELEASE_TAG#v}"           # normalise regardless of the marker's shape

          deadline=$(( $(date +%s) + 45*60 ))
          printf 'waiting for release %s on %s\n' "$RELEASE_TAG" github.com/digitrob/DigitDNS
          until gh release view "$RELEASE_TAG" --repo digitrob/DigitDNS > /dev/null 2>&1; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::release $RELEASE_TAG did not appear within 45 minutes — push it before (or with) the $GITHUB_REF_NAME tag"
              exit 1
            fi
            sleep 30
          done
          gh release upload "$RELEASE_TAG" --repo digitrob/DigitDNS --clobber \
            android/app/build/outputs/apk/release/digitdns-*.apk
          gh release upload "$RELEASE_TAG" --repo digitrob/DigitDNS --clobber \
            android/app/build/outputs/apk/release/digitdns-*.apk.sha256
          echo "-- attached to $RELEASE_TAG --"
          gh release view "$RELEASE_TAG" --repo digitrob/DigitDNS --json assets --jq '.assets[].name'
