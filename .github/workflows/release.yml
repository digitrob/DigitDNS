name: Release DigitDNS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # A tag used to publish binaries with nothing standing in front of it: the quality
  # gate existed only as a checklist somebody was meant to remember. This job is that
  # checklist, and build-and-release now waits for it.
  verify:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dashboard chart regression tests
        run: node --test tests/web/*.test.cjs

      - name: Restore script regression tests
        run: |
          for script in scripts/*.sh offline-bundle/install.sh offline-bundle/scripts/*.sh; do bash -n "$script"; done
          cmp scripts/restore.sh offline-bundle/scripts/restore.sh
          cmp scripts/uninstall.sh offline-bundle/scripts/uninstall.sh
          python3 tests/scripts/test_restore.py

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout 5m ./...

      - name: Test with the race detector
        run: go test -race -count=1 -timeout 10m ./...

  build-and-release:
    name: Build & Release Linux Binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Read from go.mod. This was pinned to '1.24' while the module required 1.26.4,
      # which meant every tagged build failed before it compiled anything — a toolchain
      # will not build a module that asks for a newer one than itself.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build Linux Binaries
        run: |
          mkdir -p dist
          
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/digitdns-linux-amd64 ./cmd/digitdns
          
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o dist/digitdns-linux-arm64 ./cmd/digitdns
          
          # Build Offline Bundle. scripts/uninstall.sh is the canonical copy;
          # offline-bundle/scripts/ holds the mirror kept
          # byte-identical. The uninstaller is not optional: install.sh copies it
          # to /opt/digitdns/scripts/uninstall.sh, and when it is missing the
          # TUI's "Complete Uninstall" falls back to an rm -rf that takes data.db
          # and master.key with it and restores neither the resolver nor the
          # firewall. version.json ships so the daemon's startup drift check has
          # a matching file.
          # config.example.json keeps its example name in the bundle: install.sh
          # looks for exactly that file to seed a fresh /opt/digitdns/config.json
          # with per-install credentials. Shipping it as config.json would skip
          # that branch entirely (the beta zip shipped it correctly).
          mkdir -p offline_temp/scripts
          cp dist/digitdns-linux-amd64 offline_temp/digitdns
          cp offline-bundle/install.sh offline_temp/install.sh
          cp config.example.json offline_temp/config.example.json
          cp offline-bundle/version.json offline_temp/version.json
          cp scripts/uninstall.sh offline_temp/scripts/uninstall.sh
          cp scripts/restore.sh offline_temp/scripts/restore.sh
          cp offline-bundle/README.txt offline_temp/README.txt
          cp offline-bundle/migrate-from-v1.sh offline_temp/migrate-from-v1.sh
          chmod +x offline_temp/install.sh offline_temp/digitdns offline_temp/scripts/*.sh offline_temp/migrate-from-v1.sh
          
          tar -czvf dist/digitdns-offline-bundle.tar.gz -C offline_temp .
          (cd offline_temp && zip -r ../dist/digitdns-offline-bundle.zip .)
          
          # Generate SHA256 Checksums
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      # Sign checksums.txt with the release key (audit fix: the self-update
      # channel must authenticate the expected hash, not merely compare it
      # against itself). The private half comes from the RELEASE_SIGNING_KEY
      # Actions secret as base64 of the raw 32-byte ed25519 key; the public half
      # is pinned in internal/selfupdate (ReleasePubKey), which refuses any
      # bundle whose checksums signature does not verify.
      #
      # The signature is published as a release ASSET (checksums.sig), not a
      # response header: GitHub serves release assets from its CDN and passes
      # none of our headers through, so a header would be silently dropped and
      # every update refused. It covers exactly the bytes of checksums.txt as
      # published — no re-serialisation on either side.
      - name: Sign the checksums manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set — refusing to publish an unsigned release bundle"
            exit 1
          fi
          go run ./tools/releasesign sign --in dist/checksums.txt --header dist/checksums.sig
          cat dist/checksums.sig

      # The signature asset must reach the release: files: dist/* above already
      # globs it in, and softprops uploads everything matched. Verify locally
      # that what we are about to publish actually verifies against the key the
      # binaries were built with — a failed release is recoverable, a published
      # unverifiable one bricks every self-update.
      - name: Verify the bundle signature
        run: go run ./tools/releasesign verify -in dist/checksums.txt -header dist/checksums.sig

      # The release body differs by channel: a "-beta" tag is a development
      # build and must say so, while a stable cut must not carry that warning.
      # Built here rather than inlined so the wording tracks the same
      # contains(github.ref_name, 'beta') test that drives the prerelease flag.
      - name: Compose the release body
        run: |
          {
            if [ -f docs/RELEASE_NOTES.md ]; then
              cat docs/RELEASE_NOTES.md
              echo
              echo "---"
              echo
            fi
            if [[ "${GITHUB_REF_NAME}" == *beta* ]]; then
              echo "> ⚠️ **UNSTABLE — development pre-release (${GITHUB_REF_NAME}).**"
            else
              echo "> **Stable release (${GITHUB_REF_NAME}).**"
              echo "> Recommended for production. Install with the one-liner in the README,"
              echo "> or upgrade in place from the dashboard's self-updater."
            fi
            echo "> Full list of changes: [docs/CHANGELOG.md](https://github.com/digitrob/DigitDNS/blob/${GITHUB_REF_NAME}/docs/CHANGELOG.md)."
          } > "${RUNNER_TEMP}/release-body.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          generate_release_notes: true
          # A "-beta" tag is a development build: publish it as a prerelease and
          # never let it take the "Latest" badge, so the pinned stable line (the
          # README's install one-liner) stays the default a new user lands on.
          # A tag without "-beta" (a future stable cut) publishes normally.
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          make_latest: ${{ contains(github.ref_name, 'beta') && 'false' || 'legacy' }}
          body_path: ${{ runner.temp }}/release-body.md

