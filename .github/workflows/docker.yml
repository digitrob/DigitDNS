name: Docker

# Builds the multi-arch container images and publishes them to GitHub Container
# Registry and Docker Hub. Three triggers, three jobs' worth of meaning:
#
#   - push to `main`        -> :edge   (tracks the default branch)
#   - push of a `v*` tag      -> :X.Y.Z + :vX.Y.Z, and :latest on a stable
#                                cut (a "-beta" tag is a prerelease and never
#                                takes :latest, matching the release policy in
#                                docs/RELEASING.md)
#   - workflow_dispatch       -> backfills a release that predates this
#         (image-tag input)      workflow: builds from the current branch and
#                                publishes that version plus :latest. The
#                                daemon code at a docs/CI-only commit is
#                                identical to the tag's, so the image matches
#                                the release binaries.
#
# Every push is signed with keyless cosign (Sigstore/OIDC — no long-lived key
# in the repository). The public half of identity is this workflow file; the
# verify command is documented in README.md. GHCR stays the primary registry;
# Docker Hub is a mirror under the namespace in vars.DOCKERHUB_NAMESPACE.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Version to publish (e.g. 3.0.0) — backfills a release that predates this workflow'
        required: false
        type: string

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # keyless cosign signing

# A second push to the same branch makes the first run's image stale, so branch
# builds supersede each other. The event name is part of the group because a
# workflow_dispatch backfill runs on the same ref as the branch: without it, a
# push arriving while a backfill is building cancels it — observed exactly once,
# when a README edit killed the v3.0.0 image build before it pushed any tags.
concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  build:
    name: Build & publish multi-arch image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'robmeister' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Emulation for the final stage's `apk add` on arm64. The Go compile
      # itself does NOT run emulated: the Dockerfile cross-compiles natively
      # via TARGETOS/TARGETARCH (CGO is off, so no cross C toolchain needed).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag and label rules. `latest=auto` (the default flavour) adds :latest
      # only for a non-prerelease semver tag, so a "-beta" cut can never take
      # the stable badge — the same rule the binary release workflow applies.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/digitdns
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/digitdns
          tags: |
            # branch push -> edge
            type=raw,value=edge,enable=${{ (github.event_name == 'push' && github.ref_type == 'branch') || (github.ref_type == 'tag' && contains(github.ref_name, 'beta')) }}
            # v3.0.0 -> 3.0.0, 3.0 (+ latest when stable, via flavour)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # backfill dispatch: 3.0.0, v3.0.0, latest
            type=raw,value=${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
            type=raw,value=v${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
            type=raw,value=latest,enable=${{ inputs.image-tag != '' }}
          labels: |
            org.opencontainers.image.title=DigitDNS
            org.opencontainers.image.description=Self-hosted DNS resolver, SNI proxy and subscriber portal — a fork of HyperDNS
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Verify the hub image runs on arm64 from both registries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in \
            "ghcr.io/${OWNER,,}/digitdns@${DIGEST}" \
            "docker.io/${DOCKERHUB_NAMESPACE}/digitdns@${DIGEST}"
          do
            docker run --rm --platform linux/arm64 --entrypoint /app/digitdns "$image" -version
          done

      # Keyless (OIDC) signature over the image digest. No private key lives in
      # the repository or in an Actions secret — Sigstore's transparency log
      # binds the signature to this repository, this workflow file and this run.
      # Verify with the command documented in README.md.
      # Pinned and retried: the installer action once spent its whole 120 s
      # budget on a single GitHub release download and turned the run red. A
      # direct download with retries fails only when cosign is genuinely
      # unreachable, and the version is explicit rather than whatever v3 floats
      # to.
      - name: Install cosign
        run: |
          mkdir -p "$HOME/.cosign"
          url="https://github.com/sigstore/cosign/releases/download/v2.5.2/cosign-linux-amd64"
          for attempt in 1 2 3 4; do
            if curl -fsSL --retry 3 --retry-delay 2 -o "$HOME/.cosign/cosign" "$url"; then
              break
            fi
            echo "cosign download failed (attempt $attempt); retrying" >&2
            sleep $((attempt * 5))
          done
          chmod +x "$HOME/.cosign/cosign"
          echo "$HOME/.cosign" >> "$GITHUB_PATH"
          "$HOME/.cosign/cosign" version

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        # ${OWNER,,} lowercases the owner: GHCR requires lowercase image names
        # and a fork under a mixed-case org would otherwise fail to sign.
        run: |
          ghcr="ghcr.io/${OWNER,,}/digitdns"
          hub="docker.io/${DOCKERHUB_NAMESPACE}/digitdns"
          cosign sign --yes "${ghcr}@${DIGEST}"
          cosign sign --yes "${hub}@${DIGEST}"

  # The relay agent is a separate image built from the same repository and the
  # same tag push. It is intentionally smaller than the hub: no database, no
  # panel, no DNS server. Publishing it here keeps both products on one release
  # page and one signing identity.
  agent:
    name: Build & publish relay-agent image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'robmeister' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/digitdns-agent
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/digitdns-agent
          tags: |
            type=raw,value=edge,enable=${{ (github.event_name == 'push' && github.ref_type == 'branch') || (github.ref_type == 'tag' && contains(github.ref_name, 'beta')) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
            type=raw,value=v${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
            type=raw,value=latest,enable=${{ inputs.image-tag != '' }}
          labels: |
            org.opencontainers.image.title=DigitDNS Relay Agent
            org.opencontainers.image.description=Geo relay agent for DigitDNS — encrypted TLS pass-through with no panel or database
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      # Pinned and retried: the installer action once spent its whole 120 s
      # budget on a single GitHub release download and turned the run red. A
      # direct download with retries fails only when cosign is genuinely
      # unreachable, and the version is explicit rather than whatever v3 floats
      # to.
      - name: Install cosign
        run: |
          mkdir -p "$HOME/.cosign"
          url="https://github.com/sigstore/cosign/releases/download/v2.5.2/cosign-linux-amd64"
          for attempt in 1 2 3 4; do
            if curl -fsSL --retry 3 --retry-delay 2 -o "$HOME/.cosign/cosign" "$url"; then
              break
            fi
            echo "cosign download failed (attempt $attempt); retrying" >&2
            sleep $((attempt * 5))
          done
          chmod +x "$HOME/.cosign/cosign"
          echo "$HOME/.cosign" >> "$GITHUB_PATH"
          "$HOME/.cosign/cosign" version

      - name: Verify the agent image is amd64 + arm64 on both registries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in \
            "ghcr.io/${OWNER,,}/digitdns-agent@${DIGEST}" \
            "docker.io/${DOCKERHUB_NAMESPACE}/digitdns-agent@${DIGEST}"
          do
            docker buildx imagetools inspect "$image" | tee /tmp/agent-index.txt
            grep -q 'linux/amd64' /tmp/agent-index.txt
            grep -q 'linux/arm64' /tmp/agent-index.txt
          done

      - name: Verify the agent image runs on arm64 from both registries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in \
            "ghcr.io/${OWNER,,}/digitdns-agent@${DIGEST}" \
            "docker.io/${DOCKERHUB_NAMESPACE}/digitdns-agent@${DIGEST}"
          do
            docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/digitdns-agent "$image" -version
          done

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ghcr="ghcr.io/${OWNER,,}/digitdns-agent"
          hub="docker.io/${DOCKERHUB_NAMESPACE}/digitdns-agent"
          cosign sign --yes "${ghcr}@${DIGEST}"
          cosign sign --yes "${hub}@${DIGEST}"
