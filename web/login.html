  <title>DigitDNS — Sign in</title>
  <!--
    Standalone login document.

    This page deliberately does NOT load the dashboard bundle: before it existed,
    the sign-in route served the full SPA shell to every unauthenticated visitor,
    so the whole admin front-end — its markup, its API surface, its JS — was
    readable pre-auth by anyone holding the namespace. This document is
    self-contained: inline CSS and one small inline script, no external asset
    requests at all, so there is nothing to load, nothing to fingerprint, and
    nothing that phones home before the operator signs in.

    The server replaces the value of the ADMIN_BASE variable below with the
    install's hidden namespace ("/<16-hex>") at serve time; every fetch is built
    from it.
  -->
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(15, 23, 42, .82);
      --border: #1e293b;
      --border-focus: #00f0ff;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #00f0ff;
      --accent-2: #6366f1;
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, .08);
      --field: rgba(2, 6, 23, .8);
      --checkbox: var(--accent);
      --field-border: var(--border);
      --focus-shadow: rgba(0, 240, 255, .12);
      --placeholder: #475569;
    }
    /* The dashboard's neutral grey theme, mirrored here so the sign-in page
       does not flash back to the blue-black palette after the operator picks
       grey. Cyan stays on the mark and the small brand line; the submit button
       becomes a slate control like the dashboard's primary actions. */
    html[data-theme="grey"] {
      --bg: #18181b;
      --panel: rgba(39, 39, 42, .85);
      --border: #3f3f46;
      --border-focus: #e4e4e7;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #e4e4e7;
      --accent-2: #a1a1aa;
      --field: rgba(9, 9, 11, .8);
      --field-border: #71717a;
      --checkbox: #71717a;
      --focus-shadow: rgba(255, 255, 255, .14);
      --placeholder: #a1a1aa;
      color-scheme: dark;
    }
    html[data-theme="grey"] body {
      background:
        radial-gradient(60rem 40rem at 85% -10%, rgba(255, 255, 255, .05), transparent 60%),
        radial-gradient(50rem 35rem at -10% 110%, rgba(255, 255, 255, .03), transparent 60%),
        var(--bg);
    }
    html[data-theme="grey"] .brand-logo {
      background: linear-gradient(135deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
      border-color: rgba(255, 255, 255, .24);
    }
    html[data-theme="grey"] button[type="submit"] {
      background: #e4e4e7;
      color: #09090b;
    }
    html[data-theme="grey"] button[type="submit"]:hover {
      background: #f4f4f5;
      filter: none;
    }

    html[data-theme="light"] {
      --bg: #f7f9fc;
      --panel: rgba(255, 255, 255, .92);
      --border: #dbe3ee;
      --border-focus: #0e7490;
      --text: #111827;
      --muted: #475569;
      --accent: #0e7490;
      --accent-2: #155e75;
      --danger: #b91c1c;
      --danger-bg: rgba(185, 28, 28, .08);
      --field: #eef3fa;
      --field-border: #64748b;
      --checkbox: #0e7490;
      --focus-shadow: rgba(14, 116, 144, .18);
      --placeholder: #64748b;
      color-scheme: light;
    }
    html[data-theme="light"] body {
      background:
        radial-gradient(60rem 40rem at 85% -10%, rgba(14, 116, 144, .08), transparent 60%),
        radial-gradient(50rem 35rem at -10% 110%, rgba(15, 23, 42, .04), transparent 60%),
        var(--bg);
    }
    html[data-theme="light"] .brand-logo {
      background: linear-gradient(135deg, rgba(14, 116, 144, .12), rgba(15, 23, 42, .05));
      border-color: rgba(14, 116, 144, .25);
    }
    html[data-theme="light"] button[type="submit"] {
      background: #0e7490;
      color: #ffffff;
    }
    html[data-theme="light"] button[type="submit"]:hover {
      background: #155e75;
      filter: none;
    }

    html[data-theme="grey"] ::selection {
      background: #e4e4e7;
      color: #09090b;
    }
    html[data-theme="light"] ::selection {
      background: #0e7490;
      color: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* Stated in the same order as the dashboard's --font-body fallback list, and
       deliberately WITHOUT a @font-face. login.html is test-pinned as the one page
       that requests nothing (login_page_test.go): it is served to an
       unauthenticated visitor, and "no stylesheet, no script, no font from the
       network" is the property that keeps the pre-auth surface to a single
       document. The dashboard's own @font-face still applies after sign-in, so
       this stack only decides which substitute is used here — and it is now the
       same substitute the dashboard would use. */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(60rem 40rem at 85% -10%, rgba(99, 102, 241, .14), transparent 60%),
        radial-gradient(50rem 35rem at -10% 110%, rgba(0, 240, 255, .10), transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .card {
      width: 100%;
      max-width: 24.5rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      padding: 1.75rem 1.6rem 1.5rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
      backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: .8rem; margin-bottom: 1.4rem; }
    .brand-logo {
      width: 2.6rem; height: 2.6rem; flex: none;
      display: flex; align-items: center; justify-content: center;
      border-radius: .8rem;
      background: linear-gradient(135deg, rgba(0, 240, 255, .18), rgba(99, 102, 241, .18));
      border: 1px solid rgba(0, 240, 255, .35);
    }
    .brand-logo svg { width: 1.3rem; height: 1.3rem; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand-name { font-size: 1.25rem; font-weight: 800; letter-spacing: .01em; }
    .brand-sub { font-size: .68rem; font-weight: 700; letter-spacing: .22em; color: var(--accent); text-transform: uppercase; }
    label { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: .95rem 0 .35rem; }
    input {
      width: 100%;
      background: var(--field);
      border: 1px solid var(--field-border);
      border-radius: .6rem;
      color: var(--text);
      font-size: .95rem;
      font-family: ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', 'SF Mono', Menlo,
        Consolas, monospace;
      padding: .62rem .75rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--focus-shadow, rgba(0, 240, 255, .12)); }
    input::placeholder { color: var(--placeholder, #475569); }
    #login-code { letter-spacing: .35em; text-align: center; }
    .hidden { display: none !important; }
    /* "Remember me": the global input rule is sized for text fields, so the
       checkbox opts out of the full width and the field padding. */
    .remember {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-top: .95rem;
      font-size: .82rem;
      font-weight: 500;
      letter-spacing: normal;
      text-transform: none;
      color: var(--muted);
      cursor: pointer;
    }
    .remember input {
      width: 1rem;
      height: 1rem;
      flex: none;
      margin: 0;
      padding: 0;
      accent-color: var(--checkbox, var(--accent));
      cursor: pointer;
    }
    .remember input:focus { box-shadow: none; }
    .error {
      display: none;
      margin-top: .9rem;
      padding: .55rem .75rem;
      border: 1px solid rgba(248, 113, 113, .35);
      background: var(--danger-bg);
      border-radius: .55rem;
      color: var(--danger);
      font-size: .82rem;
    }
    .error.is-shown { display: block; }
    button[type="submit"] {
      width: 100%;
      margin-top: 1.2rem;
      padding: .72rem;
      border: 0;
      border-radius: .6rem;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .04em;
      color: #04121a;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      cursor: pointer;
      transition: filter .15s, transform .05s;
    }
    button[type="submit"]:hover { filter: brightness(1.08); }
    button[type="submit"]:active { transform: translateY(1px); }
    button[type="submit"]:disabled { opacity: .6; cursor: wait; }
    .foot {
      margin-top: 1.15rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: .72rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <h1 class="brand-name">DigitDNS</h1>
        <div class="brand-sub">SmartDNS · SNI Proxy · Ad Blocking</div>
      </div>
    </div>

    <form id="login-form" novalidate>
      <label for="login-username">Admin username</label>
      <input type="text" id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin" required>

      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••••••" required>

      <div id="login-2fa-row" class="hidden">
        <label for="login-code">Two-factor code</label>
        <input type="text" id="login-code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      </div>

      <label class="remember" for="login-remember">
        <input type="checkbox" id="login-remember" name="remember">
        <span>Remember me</span>
      </label>

      <div id="login-error" class="error" role="alert" aria-live="assertive"></div>

      <button type="submit" id="login-submit">Authenticate &amp; access</button>
    </form>

    <div class="foot">
      <span>DigitDNS Secure Panel</span>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      // The hidden namespace this install lives under: the server splices it in
      // as the value of ADMIN_BASE below. Same shape the dashboard bundle
      // derives from the address bar: exactly 16 lowercase hex characters.
      var ADMIN_BASE = "__HDNS_ADMIN_BASE__";
      var m = window.location.pathname.match(/^\/([0-9a-f]{16})(?=\/|$)/);
      // The derived value wins when the page was reached at a matching path; the
      // injected one covers odd proxy rewrites. An empty replacement (a root
      // mount) degrades to the root paths.
      var BASE = m ? '/' + m[1] : ADMIN_BASE;

      /* --- Messages (English) ------------------------------------------------ */
      var MSG = {
        generic: 'Invalid credentials',
        net: 'Server connection failed',
        wait: 'Too many attempts. Wait a few minutes and try again.',
        code: 'Your password was accepted — enter the 6-digit code from your authenticator app.'
      };

      /* --- Submit ------------------------------------------------------------ */
      var errBox = document.getElementById('login-error');
      var codeRow = document.getElementById('login-2fa-row');
      var submitBtn = document.getElementById('login-submit');
      var rememberBox = document.getElementById('login-remember');

      // Remember me. The session token alone cannot keep the operator signed in:
      // sessions live in the daemon's memory and expire after two idle hours, so
      // this form is what a restart or a long break comes back to. Ticking the box
      // stores the submitted pair under its own localStorage key (the same one the
      // dashboard's own login overlay uses) and fills both fields next time. It
      // is plain JSON on this origin, not encrypted; unticking deletes it at once.
      var REMEMBER_KEY = 'digitdns_remember';

      function readRemembered() {
        try {
          var raw = localStorage.getItem(REMEMBER_KEY);
          if (!raw) return null;
          var saved = JSON.parse(raw);
          if (!saved || typeof saved.u !== 'string' || typeof saved.p !== 'string') return null;
          return saved;
        } catch (e) { return null; }
      }

      function saveRemembered(username, password) {
        try { localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: username, p: password })); } catch (e) { /* storage blocked */ }
      }

      function forgetRemembered() {
        try { localStorage.removeItem(REMEMBER_KEY); } catch (e) { /* storage blocked */ }
      }

      function showError(text) {
        errBox.textContent = text;
        errBox.classList.add('is-shown');
      }

      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var username = document.getElementById('login-username').value.trim();
        var password = document.getElementById('login-password').value;
        var code = document.getElementById('login-code').value.trim();
        errBox.classList.remove('is-shown');

        submitBtn.disabled = true;
        fetch(BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, code: code })
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (body) {
            if (!res.ok) {
              if (res.status === 429) {
                showError(MSG.wait);
              } else if (res.status === 401 && body && body.twofactor_required) {
                // The password verified; the second factor is what failed. Reveal
                // the code row and focus it — never shown on a plain wrong password.
                codeRow.classList.remove('hidden');
                document.getElementById('login-code').focus();
                showError(MSG.code);
              } else {
                showError((body && body.error) ? String(body.error) : MSG.generic);
              }
              return;
            }
            if (!body || !body.token) {
              showError(MSG.net);
              return;
            }
            // Only a verified login is worth remembering: a rejected password
            // would otherwise be prefilled on the next visit.
            if (rememberBox.checked) saveRemembered(username, password);
            else forgetRemembered();
            // Store the session under the canonical key the dashboard reads.
            try { localStorage.setItem('digitdns_token', body.token); } catch (e2) { /* private mode */ }
            // The query makes this a fresh navigation rather than a back/forward
            // cache restore of a dashboard document loaded before a server
            // update. The SPA routes on the path only, so it is harmless.
            window.location.replace(BASE + '/dash/home?login=' + Date.now());
          });
        }).catch(function () {
          showError(MSG.net);
        }).then(function () {
          submitBtn.disabled = false;
        });
      });

      // Unticking forgets the stored pair immediately rather than at the next
      // successful sign-in, so "off" never leaves a password behind.
      rememberBox.addEventListener('change', function () {
        if (!rememberBox.checked) forgetRemembered();
      });

      // Fill the fields before the first paint, then put the cursor where the
      // operator will type: the password when the pair came back, otherwise the
      // username.
      var savedLogin = readRemembered();
      if (savedLogin) {
        rememberBox.checked = true;
        document.getElementById('login-username').value = savedLogin.u;
        document.getElementById('login-password').value = savedLogin.p;
        document.getElementById('login-password').focus();
      } else {
        // Focus the first empty field, for keyboard operators.
        var first = document.getElementById('login-username');
        if (first && !first.value) first.focus();
      }
    })();
  </script>
</body>
</html>
