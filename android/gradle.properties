# JVM. 2g is enough for this module today; raise only if a build proves otherwise.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is the whole stack here; the legacy support library is not a dependency.
android.useAndroidX=true

# The Kotlin compiler is the only source set that needs this; it removes the
# boilerplate accessors generated for synthetically-imported properties.
kotlin.code.style=official

# Build only the resources and sources for the ABI(s) a device actually uses, so
# a debug build does not wait on four sets of native artifacts it will never load.
android.nonTransitiveRClass=true

# Configuration cache and caching are on by default in this Gradle version; stated
# here so a contributor's global gradle.properties cannot silently turn them off.
org.gradle.caching=true
