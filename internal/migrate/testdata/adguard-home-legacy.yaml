# Synthetic AdGuard Home configuration using the pre-persistent clients key.
# Kept separate so a parser cannot quietly assume only clients.persistent exists.

filters:
  - enabled: true
    url: https://lists.example.invalid/legacy-ads.txt
    name: Legacy Ads
    id: 10

user_rules:
  - "||legacy-ads.example^"

dns:
  upstream_dns:
    - 192.0.2.53
  rewrites:
    - domain: legacy-pin.example
      answer: 192.0.2.20

clients:
  - name: legacy-laptop
    ids:
      - 192.0.2.30
    use_global_settings: true
    filtering_enabled: true
  - name: legacy-phone
    ids:
      - 192.0.2.31
    use_global_settings: true
    filtering_enabled: true
